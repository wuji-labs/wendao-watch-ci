# 闻道 iPhone + Apple Watch 原生端。工程由 XcodeGen 生成：xcodegen generate（.xcodeproj 不入库）。
name: Wendao
options:
  bundleIdPrefix: com.wujilabs
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 5HNCY2JAA4
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  WendaoKit:
    path: WendaoKit

targets:
  Wendao:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - package: WendaoKit
      - target: WendaoWatch
    settings:
      base:
        PRODUCT_NAME: Wendao
        PRODUCT_BUNDLE_IDENTIFIER: com.wujilabs.wendao
        INFOPLIST_FILE: Config/iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/AppGroup.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  WendaoWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    dependencies:
      - package: WendaoKit
      - target: WendaoWatchWidgets
    settings:
      base:
        PRODUCT_NAME: WendaoWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.wujilabs.wendao.watchkitapp
        INFOPLIST_FILE: Config/Watch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/AppGroup.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  WendaoWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared/Intents
    dependencies:
      - package: WendaoKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: WendaoWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.wujilabs.wendao.watchkitapp.widgets
        INFOPLIST_FILE: Config/WatchWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/AppGroup.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  WendaoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSTests
    dependencies:
      - target: Wendao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wujilabs.wendao.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Wendao:
    build:
      targets:
        Wendao: all
        WendaoTests: [test]
    test:
      targets:
        - WendaoTests
      gatherCoverageData: true
  WendaoWatch:
    build:
      targets:
        WendaoWatch: all
